<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 Replay</title>
<style>
  :root {
    --bg: #faf8ef; --panel: #ffffff; --ink: #3c3a32; --muted: #8f8a80; --line: #e4ded3;
    --accent: #e8743b; --accent-soft: #fbe3d6; --board: #bbada0; --bar: #ece6dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a18; --panel: #252420; --ink: #ece8e0; --muted: #9c968b; --line: #3a3832;
      --accent: #f08a52; --accent-soft: #4a3226; --board: #8c8075; --bar: #34322d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  .meta { color: var(--muted); margin-top: 4px; font-size: 13px; word-break: break-all; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 20px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: 96px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }

  .layout { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .board {
    container-type: inline-size; width: min(420px, 100%); aspect-ratio: 1;
    background: var(--board); border-radius: 10px; padding: 2.4%;
    display: grid; gap: 2.4%;
  }
  .tile {
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-variant-numeric: tabular-nums; user-select: none;
  }
  .tile.spawn { animation: pop 0.18s ease-out; }
  @keyframes pop { from { transform: scale(0.4); opacity: 0.3; } to { transform: scale(1); opacity: 1; } }

  .side { flex: 1 1 260px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .now { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .now b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .gain { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; min-height: 1.4em; }
  .prob { display: grid; grid-template-columns: 22px 44px 1fr 52px; align-items: center; gap: 8px; padding: 3px 0; }
  .prob .arrow { font-size: 17px; text-align: center; }
  .prob .name { color: var(--muted); font-size: 13px; }
  .prob .track { height: 10px; background: var(--bar); border-radius: 5px; overflow: hidden; }
  .prob .fill { display: block; height: 100%; width: 0; background: var(--muted); border-radius: 5px; transition: width 0.12s; }
  .prob .pct { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .prob.chosen .fill { background: var(--accent); }
  .prob.chosen .name, .prob.chosen .pct { color: var(--ink); font-weight: 600; }
  .prob.illegal { opacity: 0.35; }
  .note { color: var(--muted); font-size: 13px; }

  .controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 22px 0 10px; }
  button, select {
    font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 76px; font-weight: 600; }
  .spacer { flex: 1; }
  .pos { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 4px 0 18px; }

  .chart { position: relative; height: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: crosshair; overflow: hidden; }
  .chart svg { position: absolute; inset: 10px 0 0 0; width: 100%; height: calc(100% - 10px); }
  .chart .area { fill: var(--accent-soft); }
  .chart .lineP { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .cursor { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: 0.6; pointer-events: none; }
  .milestone { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--muted); pointer-events: none; }
  .milestone span { position: absolute; top: 4px; left: 4px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .chart-label { position: absolute; right: 10px; bottom: 6px; font-size: 11px; color: var(--muted); }
  .keys { color: var(--muted); font-size: 12px; margin-top: 12px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 11px ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <header>
    <h1>2048 replay</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="stats" id="stats"></div>

  <div class="layout">
    <div class="board" id="board"></div>
    <div class="side">
      <div class="card">
        <div class="now"><span class="note" id="moveLabel"></span><b id="score"></b></div>
        <div class="gain" id="gain"></div>
      </div>
      <div class="card">
        <h2 id="probTitle">Next move</h2>
        <div id="probs"></div>
        <div class="note" id="probNote"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="first" title="Start (Home)">⏮</button>
    <button id="prev" title="Back (←)">◀</button>
    <button id="play" class="primary" title="Play / pause (Space)">Play</button>
    <button id="next" title="Forward (→)">▶</button>
    <button id="last" title="End (End)">⏭</button>
    <select id="speed" title="Playback speed">
      <option value="2">2 moves/s</option>
      <option value="5">5 moves/s</option>
      <option value="10" selected>10 moves/s</option>
      <option value="25">25 moves/s</option>
      <option value="60">60 moves/s</option>
    </select>
    <span class="spacer"></span>
    <span class="pos" id="pos"></span>
  </div>
  <input type="range" id="slider" min="0" value="0" aria-label="Position in game">

  <div class="chart" id="chart">
    <svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="area" id="area"></path>
      <path class="lineP" id="line"></path>
    </svg>
    <div class="cursor" id="cursor"></div>
    <div class="chart-label">score over the game · click to jump</div>
  </div>
  <div class="keys"><kbd>Space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> step · <kbd>Home</kbd> <kbd>End</kbd> jump</div>
</main>

<script id="data" type="application/json">__REPLAY_DATA__</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const F = D.frames, N = F.length, size = D.size;
  const ARROWS = ["↑", "→", "↓", "←"], NAMES = ["up", "right", "down", "left"];
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toLocaleString("en-US");

  // Header
  const m = D.meta;
  $("meta").textContent = [m.agent, m.model, "seed " + m.seed].filter(Boolean).join(" · ");
  $("stats").innerHTML = [
    ["Final score", fmt(m.score)], ["Max tile", fmt(m.maxTile)], ["Moves", fmt(m.moves)],
  ].map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");

  // Board
  const board = $("board");
  board.style.gridTemplateColumns = board.style.gridTemplateRows = `repeat(${size}, 1fr)`;
  const tiles = Array.from({ length: size * size }, () => {
    const t = document.createElement("div");
    t.className = "tile";
    board.appendChild(t);
    return t;
  });
  const fontFor = (digits) => [0, 11, 11, 9, 7.2, 5.8, 4.8][Math.min(digits, 6)] * 4 / size;

  // Probabilities
  $("probs").innerHTML = ARROWS.map((a, i) =>
    `<div class="prob" id="p${i}"><span class="arrow">${a}</span><span class="name">${NAMES[i]}</span>` +
    `<span class="track"><span class="fill"></span></span><span class="pct"></span></div>`).join("");
  const hasProbs = F.some((f) => f.p);
  if (!hasProbs) $("probNote").textContent = "This agent doesn't report move probabilities.";

  // Score chart
  const maxScore = Math.max(1, F[N - 1].s);
  const pts = F.map((f, i) => [(i / Math.max(1, N - 1)) * 1000, 100 - (f.s / maxScore) * 92]);
  const d = pts.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join("");
  $("line").setAttribute("d", d);
  $("area").setAttribute("d", d + "L1000 100L0 100Z");
  const chart = $("chart");
  const pct = (i) => (i / Math.max(1, N - 1)) * 100 + "%";
  for (const tile of [256, 512, 1024, 2048, 4096, 8192]) {
    const e = Math.log2(tile);
    const i = F.findIndex((f) => Math.max(...f.b) >= e);
    if (i < 0) continue;
    const el = document.createElement("div");
    el.className = "milestone";
    el.style.left = pct(i);
    el.innerHTML = `<span>${tile}</span>`;
    chart.appendChild(el);
  }

  // State
  const slider = $("slider");
  slider.max = N - 1;
  let cur = 0, playing = false, timer = null;

  function show(i, animate) {
    cur = Math.max(0, Math.min(N - 1, i));
    const f = F[cur];
    f.b.forEach((e, k) => {
      const t = tiles[k];
      const v = e ? 2 ** e : 0;
      t.textContent = v ? v : "";
      t.style.background = D.palette[Math.min(e, D.palette.length - 1)];
      t.style.color = e <= 2 ? D.darkText : D.lightText;
      t.style.fontSize = fontFor(String(v).length) + "cqi";
      t.classList.remove("spawn");
      if (animate && k === f.sp) { void t.offsetWidth; t.classList.add("spawn"); }
    });
    $("score").textContent = fmt(f.s);
    $("moveLabel").textContent = cur === N - 1 ? "Game over" : `Move ${cur + 1}`;
    $("gain").textContent = f.g ? `+${fmt(f.g)}` : "";
    $("probTitle").textContent = cur === N - 1 ? "No moves left" : "Next move";
    for (let a = 0; a < 4; a++) {
      const row = $("p" + a);
      const p = f.p ? f.p[a] : (f.a === a ? 1 : 0);
      row.classList.toggle("chosen", f.a === a);
      row.classList.toggle("illegal", !f.m[a]);
      row.querySelector(".fill").style.width = (f.a === null ? 0 : p * 100) + "%";
      row.querySelector(".pct").textContent =
        f.a === null ? "" : !f.m[a] ? "illegal" : f.p ? (p * 100).toFixed(1) + "%" : (f.a === a ? "chosen" : "");
    }
    slider.value = cur;
    $("cursor").style.left = pct(cur);
    $("pos").textContent = `${fmt(cur)} / ${fmt(N - 1)}`;
  }

  function setPlaying(on) {
    playing = on;
    $("play").textContent = on ? "Pause" : "Play";
    clearTimeout(timer);
    if (on) tick();
  }
  function tick() {
    if (cur >= N - 1) return setPlaying(false);
    show(cur + 1, true);
    timer = setTimeout(tick, 1000 / Number($("speed").value));
  }

  $("play").onclick = () => setPlaying(!playing && (cur < N - 1 || (show(0), true)));
  $("first").onclick = () => { setPlaying(false); show(0); };
  $("last").onclick = () => { setPlaying(false); show(N - 1); };
  $("prev").onclick = () => { setPlaying(false); show(cur - 1); };
  $("next").onclick = () => { setPlaying(false); show(cur + 1, true); };
  slider.oninput = () => { setPlaying(false); show(Number(slider.value)); };
  const seek = (ev) => {
    const r = chart.getBoundingClientRect();
    setPlaying(false);
    show(Math.round(((ev.clientX - r.left) / r.width) * (N - 1)));
  };
  chart.addEventListener("pointerdown", (ev) => { seek(ev); chart.setPointerCapture(ev.pointerId); });
  chart.addEventListener("pointermove", (ev) => { if (ev.buttons) seek(ev); });
  document.addEventListener("keydown", (ev) => {
    if (ev.target.tagName === "SELECT") return;
    const k = ev.key;
    if (k === " ") { ev.preventDefault(); $("play").click(); }
    else if (k === "ArrowRight") { ev.preventDefault(); $("next").click(); }
    else if (k === "ArrowLeft") { ev.preventDefault(); $("prev").click(); }
    else if (k === "Home") { ev.preventDefault(); $("first").click(); }
    else if (k === "End") { ev.preventDefault(); $("last").click(); }
  });

  show(0);
})();
</script>
</body>
</html>
